name: Stop obsolete layout run
on:
  push:
    branches: [work/stop-layout-run]
permissions:
  actions: write
jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run_id = 39536659601;
            const result = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id });
            if (result.data.head_sha !== 'bb010105530fd4461368333c3f55e2bef027d4a2') throw new Error('Unexpected run identity');
            if (result.data.status !== 'completed') {
              await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel', { ...context.repo, run_id });
              core.info('Force-cancelled the superseded unbounded browser run');
            }
