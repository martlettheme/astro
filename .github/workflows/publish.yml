name: Publish npm package
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: npm-release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.event.release.prerelease == false
    uses: ./.github/workflows/verify.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use an npm CLI with trusted-publishing support
        run: npm install --global npm@11
      - name: Verify release identity and main ancestry
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node scripts/check-release.mjs
          git merge-base --is-ancestor HEAD origin/main
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: npm run build --if-present
      - run: npm test
      - run: git diff --exit-code
      - name: Publish through npm trusted publishing
        run: npm publish --access public
        env:
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.private && 'false' || 'true' }}
